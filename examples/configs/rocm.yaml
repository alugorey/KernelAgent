# AMD ROCm platform config — rocprofv3 profiling, wave32/wave64 aware.
#
# Requires ROCm PyTorch + Triton and rocprofv3 on PATH (or set
# KERNELAGENT_ROCPROFV3).  The GPU and its wavefront size (64 on
# CDNA/Instinct, 32 on RDNA/gfx12) are auto-detected from
# /sys/class/kfd; set gpu_name to pin a specs-database entry
# (e.g. "AMD Instinct MI300X") and KERNELAGENT_WAVEFRONT_SIZE=32|64 to
# override the wavefront size used in prompts.
#
# Usage:
#   python examples/run_opt_manager.py \
#       --kernel-dir examples/optimize_01_matvec \
#       --strategy rocm

strategy: beam_search
num_workers: 4
strategy_config:
  num_top_kernels: 2
  num_bottlenecks: 2
openai_model: gpt-5
high_reasoning_effort: true

# Worker configuration
benchmark_warmup: 25
benchmark_repeat: 100
divergence_threshold: 50.0
target_platform: rocm
# gpu_name: "AMD Instinct MI300X"  # optional; auto-detected when omitted

platform: rocm

templates:
  kernel_optimization: triton_kernel_agent/templates/kernel_optimization.j2
  reflexion_prompt: triton_kernel_agent/templates/reflexion_prompt.j2
  triton_guidelines: triton_kernel_agent/templates/triton_guidelines.j2
